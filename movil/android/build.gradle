// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlinVersion = '2.0.20' // copia local: el buildscript se evalua antes que variables.gradle
    
    repositories {
        // Espejos primero: dl.google.com / Maven Central pueden estar bloqueados por region.
        // Son espejos completos; si tienes acceso directo, sube google()/mavenCentral() arriba.
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // Espejos primero: dl.google.com / Maven Central pueden estar bloqueados por region.
        // Son espejos completos; si tienes acceso directo, sube google()/mavenCentral() arriba.
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
